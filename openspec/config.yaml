schema: spec-driven
context: |
  RutasVenezuela, Equipo 2, UCAB. Documentación funcional en español.
  PostgreSQL/Supabase es el gestor OLTP y la fuente de verdad de reglas de negocio.
  FastAPI/React es el stack de referencia provisional; aplicación aún por confirmar.
  Modelo relacional de la primera entrega aceptado; no se rediseña por observaciones del ERE.
  Consultar references/first-delivery.md, docs/README.md,
  docs/requirements/traceability-detailed.csv y docs/development/tdd-guide.md.
  103 historias y 324 criterios en 23 capacidades OpenSpec, sujetos a revisión.
  Ramas: <author>(<kind>/<layer>)-<description>, hacia develop; conservar historial.
rules:
  proposal:
    - Identificar fuente, alcance, responsable y dependencias.
    - Diferenciar decisiones confirmadas, provisionales y pendientes.
  specs:
    - Especificar comportamiento observable con Given/When/Then.
    - No inventar claves, reglas ni atributos que no aparecen en la fuente.
  design:
    - Las invariantes se implementan en PostgreSQL y se validan desde la API.
    - Mantener contratos de backend y frontend neutrales a frameworks no confirmados.
  tasks:
    - Vincular escenarios con casos TDD y responsable.
    - Implementar RED, GREEN, REFACTOR solo después de revisión humana.
