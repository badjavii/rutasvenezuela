<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="140" viewBox="0 0 420 140">
  <title>RutasVenezuela</title>
  <desc>Pixel-inspired RV monogram in Catppuccin green.</desc>

  <defs>
    <pattern id="pixels" width="6" height="6"
             patternUnits="userSpaceOnUse">
      <rect width="5.5" height="5.5" fill="#a6e3a1"/>
      <rect width="2" height="2" fill="#c4f0b9"
            opacity="0.45"/>
    </pattern>
  </defs>

  <g fill="url(#pixels)"
     shape-rendering="crispEdges">
    <!-- R -->
    <path d="
      M80 20 H150 V30 H160 V65 H150 V75 H135
      L165 120 H130 L103 80 H110 V120
      H80 Z
      M110 45 V62 H130 V45 Z"
      fill-rule="evenodd"/>

    <!-- V -->
    <path d="
      M185 20 H218 L242 86
      L266 20 H299 L258 120
      H226 Z"/>
  </g>

  <g opacity="0.25" fill="#74c7ec"
     shape-rendering="crispEdges">
    <rect x="70" y="110" width="10" height="10"/>
    <rect x="170" y="30" width="10" height="10"/>
    <rect x="300" y="100" width="10" height="10"/>
    <rect x="310" y="110" width="10" height="10"/>
  </g>
</svg>
