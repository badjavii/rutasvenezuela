name: Calidad de documentación SDD/TDD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-documentation:
    name: Validar fuentes, specs y trazabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar matriz académica original
        run: python3 scripts/validar_trazabilidad.py
      - name: Comprobar cobertura de SDD y TDD
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/validar_plan_sdd_tdd.py
      - name: Comprobar estructura documental
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f openspec/config.yaml
          test -f docs/sdd-openspec.md
          test -f docs/pruebas-tdd.md
          test -f docs/trazabilidad-detallada.csv
          test -f docs/contratos-por-capa.md
          test -f docs/flujo-git.md
          echo 'Estructura documental presente.'
