name: Database (build and SQL tests)

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Build the schema and run SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build from scratch
        run: psql "$DATABASE_URL" -f database/build.sql
      - name: Build again (the build can be repeated)
        run: psql "$DATABASE_URL" -f database/build.sql
      - name: Run SQL tests
        run: psql "$DATABASE_URL" -f database/test.sql
